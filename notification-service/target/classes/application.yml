server:
  port: 8082

spring:
  application:
    name: notification-service
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      # Recommence au début si aucun offset n'est enregistré pour ce groupe
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Utiliser ErrorHandlingDeserializer pour intercepter proprement les erreurs de désérialisation
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # Configurer le désérialiseur JSON comme délégué
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Indique à Spring de faire confiance aux packages de DTO pour éviter des failles de sécurité de désérialisation
        spring.json.trusted.packages: "com.example.orderservice.event,com.example.notificationservice.event"
        # Mappage de la classe du producteur (order-service) vers celle du consommateur (notification-service)
        spring.json.type.mapping: "com.example.orderservice.event.OrderEvent:com.example.notificationservice.event.OrderEvent"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

